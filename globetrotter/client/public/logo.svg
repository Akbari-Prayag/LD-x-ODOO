<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <!-- Location Pin Outline in Dark Navy -->
  <path
    d="M 140,115 C 140,70 170,40 210,40 C 250,40 280,70 280,115 C 280,150 250,185 210,225 C 170,185 140,150 140,115 Z"
    stroke="#18223c"
    stroke-width="14"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  />

  <!-- Interior Circuit Node Dot -->
  <circle cx="210" cy="115" r="14" fill="#18223c" />

  <!-- Swooping Flight Path from Center to Airplane -->
  <path
    d="M 210,115 C 210,175 270,175 285,145 C 295,125 315,90 325,75"
    stroke="#38bdf8"
    stroke-width="12"
    stroke-linecap="round"
    fill="none"
  />

  <!-- Sky Blue Connecting Dot -->
  <circle cx="285" cy="145" r="9" fill="#38bdf8" />

  <!-- Sky Blue Airplane Taking Flight -->
  <g transform="translate(325, 75) rotate(42)">
    <path
      d="M 0,-18 L 6,-6 L 22,0 L 6,6 L 4,16 L 0,14 L -4,16 L -6,6 L -22,0 L -6,-6 Z"
      fill="#38bdf8"
    />
  </g>

  <!-- TRIPLY Brand Typography -->
  <text
    x="200"
    y="275"
    text-anchor="middle"
    font-family="'Plus Jakarta Sans', 'Inter', sans-serif"
    font-size="44"
    font-weight="900"
    letter-spacing="4"
    fill="#18223c"
  >
    TRIPLY
  </text>
</svg>
